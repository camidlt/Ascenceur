<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>L'Ascenseur</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg2: #f5f5f4; --bg3: #ebebea;
      --text: #1a1a1a; --text2: #6b7280; --text3: #9ca3af;
      --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
      --success-bg: #eaf3de; --success-text: #3b6d11;
      --danger-bg: #fcebeb;  --danger-text: #a32d2d;
      --info-bg: #e6f1fb;    --info-text: #185fa5;
      --warn-bg: #faeeda;    --warn-text: #854f0b;
      --radius: 10px; --radius-sm: 7px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1c; --bg2: #252525; --bg3: #2e2e2e;
        --text: #f0f0ef; --text2: #9ca3af; --text3: #6b7280;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
        --success-bg: #173404; --success-text: #c0dd97;
        --danger-bg: #501313;  --danger-text: #f09595;
        --info-bg: #042c53;    --info-text: #85b7eb;
        --warn-bg: #412402;    --warn-text: #fac775;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1rem; }
    #root { max-width: 480px; margin: 0 auto; padding-top: 0.5rem; }
    .btn { background: transparent; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 16px; font-size: 14px; cursor: pointer; color: var(--text); font-family: inherit; transition: background 0.12s; -webkit-tap-highlight-color: transparent; }
    .btn:hover, .btn:active { background: var(--bg2); }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn-primary:hover, .btn-primary:active { opacity: 0.85; background: var(--text); }
    .btn-sm { padding: 5px 12px; font-size: 13px; }
    .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; }
    input[type="text"] { width: 100%; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 15px; color: var(--text); font-family: inherit; outline: none; }
    input[type="text"]:focus { border-color: var(--border2); }
    .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 12px; font-weight: 500; padding: 3px 10px; white-space: nowrap; }
    .pill-info    { background: var(--info-bg);    color: var(--info-text); }
    .pill-success { background: var(--success-bg); color: var(--success-text); }
    .pill-danger  { background: var(--danger-bg);  color: var(--danger-text); }
    .pill-warn    { background: var(--warn-bg);    color: var(--warn-text); }
    .pill-neutral { background: var(--bg3);        color: var(--text2); }
    .banner-warn    { background: var(--warn-bg);    color: var(--warn-text);    border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; }
    .banner-success { background: var(--success-bg); color: var(--success-text); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; }
    table { border-collapse: collapse; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const ROUNDS = [1,2,3,4,5,6,7,6,5,4,3,2,1];
const SAVE_KEY = 'ascenseur_v1';

function saveGame(state) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadGame() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch(e) { return null; }
}
function clearGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

function getScore(bid, tricks) {
  return bid === tricks ? 1 + bid : -(Math.abs(bid - tricks));
}

function Avatar({ name, size = 36 }) {
  const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const COLORS = [
    { bg: 'var(--info-bg)', color: 'var(--info-text)' },
    { bg: 'var(--success-bg)', color: 'var(--success-text)' },
    { bg: 'var(--warn-bg)', color: 'var(--warn-text)' },
    { bg: 'var(--danger-bg)', color: 'var(--danger-text)' },
  ];
  const c = COLORS[(name.charCodeAt(0) || 0) % COLORS.length];
  return React.createElement('div', {
    style: { width: size, height: size, borderRadius: '50%', background: c.bg, color: c.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: Math.round(size * 0.36), fontWeight: 500, flexShrink: 0, userSelect: 'none' }
  }, initials || '?');
}

function SetupScreen({ onStart, hasSave, onResume }) {
  const [names, setNames] = useState(['', '']);
  const addPlayer = () => setNames(n => [...n, '']);
  const removePlayer = i => setNames(n => n.filter((_, j) => j !== i));
  const updateName = (i, v) => setNames(n => n.map((x, j) => j === i ? v : x));
  const valid = names.length >= 2 && names.every(n => n.trim().length > 0);
  return React.createElement('div', null,
    React.createElement('p', { style: { fontSize: 24, fontWeight: 600, marginBottom: 4 } }, "L'Ascenseur"),
    React.createElement('p', { style: { fontSize: 14, color: 'var(--text2)', marginBottom: '1.5rem' } }, '13 manches · +1+pli si réussi · −écart si raté'),
    hasSave && React.createElement('div', { style: { marginBottom: '1.5rem' } },
      React.createElement('div', { className: 'banner-warn', style: { display: 'flex', alignItems: 'center', gap: 12 } },
        React.createElement('span', { style: { flex: 1 } }, 'Une partie est en cours.'),
        React.createElement('button', { className: 'btn btn-primary btn-sm', onClick: onResume }, 'Reprendre →')
      )
    ),
    React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 10, marginBottom: '1rem' } },
      names.map((name, i) =>
        React.createElement('div', { key: i, style: { display: 'flex', gap: 8, alignItems: 'center' } },
          React.createElement(Avatar, { name: name || '?', size: 34 }),
          React.createElement('input', { type: 'text', placeholder: `Joueur ${i+1}`, value: name, onChange: e => updateName(i, e.target.value) }),
          names.length > 2 && React.createElement('button', {
            className: 'btn btn-sm', onClick: () => removePlayer(i),
            style: { color: 'var(--danger-text)', flexShrink: 0 }
          }, '−')
        )
      )
    ),
    React.createElement('div', { style: { display: 'flex', gap: 8 } },
      React.createElement('button', { className: 'btn btn-sm', onClick: addPlayer }, '+ Joueur'),
      React.createElement('button', {
        className: 'btn btn-primary', style: { marginLeft: 'auto', opacity: valid ? 1 : 0.4 },
        onClick: () => valid && onStart(names.map(n => n.trim()))
      }, hasSave ? 'Nouvelle partie' : 'Commencer →')
    )
  );
}

function ScoreTable({ players, currentRound }) {
  const totals = players.map(p => p.scores.reduce((a, b) => a + b, 0));
  return React.createElement('div', { style: { overflowX: 'auto' } },
    React.createElement('table', { style: { width: '100%', fontSize: 13 } },
      React.createElement('thead', null,
        React.createElement('tr', null,
          React.createElement('th', { style: { textAlign: 'left', color: 'var(--text2)', fontWeight: 400, paddingBottom: 8, fontSize: 12, whiteSpace: 'nowrap' } }, 'Manche'),
          ...players.map((p, i) =>
            React.createElement('th', { key: i, style: { textAlign: 'center', fontWeight: 500, paddingBottom: 8, paddingLeft: 6 } }, p.name.split(' ')[0])
          )
        )
      ),
      React.createElement('tbody', null,
        ROUNDS.slice(0, currentRound).map((cards, ri) =>
          React.createElement('tr', { key: ri, style: { borderTop: '0.5px solid var(--border)' } },
            React.createElement('td', { style: { color: 'var(--text2)', padding: '5px 0', fontSize: 12, whiteSpace: 'nowrap' } }, `M${ri+1} (${cards})`),
            ...players.map((p, pi) => {
              const s = p.scores[ri];
              return React.createElement('td', { key: pi, style: { textAlign: 'center', padding: '5px 6px' } },
                s !== undefined
                  ? React.createElement('span', { style: { color: s > 0 ? 'var(--success-text)' : s < 0 ? 'var(--danger-text)' : 'var(--text2)', fontWeight: 500 } }, (s > 0 ? '+' : '') + s)
                  : React.createElement('span', { style: { color: 'var(--text3)' } }, '—')
              );
            })
          )
        ),
        React.createElement('tr', { style: { borderTop: '1px solid var(--border2)' } },
          React.createElement('td', { style: { fontWeight: 600, fontSize: 13, padding: '7px 0' } }, 'Total'),
          ...totals.map((t, i) =>
            React.createElement('td', { key: i, style: { textAlign: 'center', fontWeight: 600, fontSize: 15, paddingLeft: 6 } }, t)
          )
        )
      )
    )
  );
}

function BiddingPhase({ players, round, roundIndex, onDone, onBack, canGoBack }) {
  const [bids, setBids] = useState({});
  const biddingPlayer = players.findIndex((_, i) => bids[i] === undefined);
  const done = biddingPlayer === -1;
  const isLast = !done && biddingPlayer === players.length - 1;
  const sumSoFar = Object.values(bids).reduce((a, b) => a + b, 0);
  const forbidden = isLast ? round - sumSoFar : -1;
  const forbiddenInvalid = forbidden < 0 || forbidden > round;
  const options = Array.from({ length: round + 1 }, (_, i) => i);

  const handleBack = () => {
    const lastSet = players.reduce((acc, _, i) => bids[i] !== undefined ? i : acc, -1);
    if (lastSet >= 0) setBids(b => { const nb = { ...b }; delete nb[lastSet]; return nb; });
    else if (canGoBack) onBack();
  };

  return React.createElement('div', null,
    React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: '1rem' } },
      React.createElement('span', { className: 'pill pill-info' }, `Manche ${roundIndex + 1} / ${ROUNDS.length}`),
      React.createElement('span', { style: { fontSize: 14, color: 'var(--text2)' } }, `${round} carte${round > 1 ? 's' : ''}`),
      React.createElement('span', { style: { marginLeft: 'auto', fontSize: 12, color: 'var(--text3)' } }, 'PARIS'),
      (Object.keys(bids).length > 0 || canGoBack) && React.createElement('button', { className: 'btn btn-sm', onClick: handleBack, style: { fontSize: 12, marginLeft: 8 } }, '← Retour')
    ),
    done
      ? React.createElement('div', null,
          React.createElement('p', { style: { fontSize: 13, color: 'var(--text2)', marginBottom: '0.75rem' } }, 'Récap des paris :'),
          React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, marginBottom: '0.75rem' } },
            players.map((p, i) =>
              React.createElement('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: 10 } },
                React.createElement(Avatar, { name: p.name, size: 32 }),
                React.createElement
